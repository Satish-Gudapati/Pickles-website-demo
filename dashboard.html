<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Pickles Paradise</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard-section {
            max-width: 1200px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            color: #2c3e50;
            font-size: 2.2em;
        }

        .add-product-btn {
            background: #2ecc71;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-product-btn:hover {
            background: #27ae60;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .products-table th,
        .products-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .products-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
        }

        .products-table tr:hover {
            background: #f8f9fa;
        }

        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .edit-btn {
            background: #3498db;
            color: white;
        }

        .edit-btn:hover {
            background: #2980b9;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .product-form {
            display: none;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .product-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2ecc71;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .save-btn {
            background: #2ecc71;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            background: #27ae60;
        }

        .cancel-btn {
            background: #e74c3c;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cancel-btn:hover {
            background: #c0392b;
        }

        .product-image-preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">Pickles Paradise</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <!-- Dashboard Section -->
    <section class="dashboard-section">
        <div class="dashboard-header">
            <h1>Admin Dashboard</h1>
            <button class="add-product-btn" onclick="showAddProductForm()">Add New Product</button>
        </div>

        <!-- Success/Error Messages -->
        <div id="success-message" class="success-message"></div>
        <div id="error-message" class="error-message"></div>

        <!-- Products Table -->
        <table class="products-table">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="products-table-body">
                <!-- Products will be dynamically added here -->
            </tbody>
        </table>

        <!-- Add/Edit Product Form -->
        <div id="product-form" class="product-form">
            <h2 id="form-title">Add New Product</h2>
            <form id="product-form-element" onsubmit="handleProductSubmit(event)">
                <input type="hidden" id="product-id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="product-name">Product Name *</label>
                        <input type="text" id="product-name" required>
                    </div>
                    <div class="form-group">
                        <label for="product-category">Category *</label>
                        <select id="product-category" required>
                            <option value="veg">Veg Pickles</option>
                            <option value="non-veg">Non-Veg Pickles</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="product-price">Price (₹) *</label>
                        <input type="number" id="product-price" required min="0">
                    </div>
                    <div class="form-group">
                        <label for="product-image">Product Image *</label>
                        <input type="file" id="product-image" accept="image/*" required>
                        <img id="image-preview" class="product-image-preview" style="display: none;">
                    </div>
                </div>
                <div class="form-group">
                    <label for="product-description">Description *</label>
                    <textarea id="product-description" required></textarea>
                </div>
                <div class="form-group">
                    <label for="product-ingredients">Ingredients *</label>
                    <textarea id="product-ingredients" required></textarea>
                </div>
                <div class="form-group">
                    <label for="product-storage">Storage Instructions *</label>
                    <textarea id="product-storage" required></textarea>
                </div>
                <div class="form-group">
                    <label for="product-weight">Weight (g) *</label>
                    <input type="number" id="product-weight" required min="0">
                </div>
                <div class="form-actions">
                    <button type="submit" class="save-btn">Save Product</button>
                    <button type="button" class="cancel-btn" onclick="hideProductForm()">Cancel</button>
                </div>
            </form>
        </div>
    </section>

    <script>
        // Get products from localStorage or initialize empty array
        let products = JSON.parse(localStorage.getItem('products')) || [];

        // Display products in table
        function displayProducts() {
            const tableBody = document.getElementById('products-table-body');
            tableBody.innerHTML = '';

            products.forEach((product, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><img src="${product.image}" alt="${product.name}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;"></td>
                    <td>${product.name}</td>
                    <td>${product.category === 'veg' ? 'Veg Pickles' : 'Non-Veg Pickles'}</td>
                    <td>₹${product.price}</td>
                    <td>${product.description.substring(0, 50)}...</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="editProduct(${index})">Edit</button>
                        <button class="action-btn delete-btn" onclick="deleteProduct(${index})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Show add product form
        function showAddProductForm() {
            document.getElementById('form-title').textContent = 'Add New Product';
            document.getElementById('product-form-element').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('product-form').classList.add('active');
        }

        // Hide product form
        function hideProductForm() {
            document.getElementById('product-form').classList.remove('active');
        }

        // Handle product form submission
        function handleProductSubmit(event) {
            event.preventDefault();

            const productId = document.getElementById('product-id').value;
            const productData = {
                name: document.getElementById('product-name').value,
                category: document.getElementById('product-category').value,
                price: parseFloat(document.getElementById('product-price').value),
                image: document.getElementById('image-preview').src,
                description: document.getElementById('product-description').value,
                ingredients: document.getElementById('product-ingredients').value,
                storage: document.getElementById('product-storage').value,
                weight: parseInt(document.getElementById('product-weight').value)
            };

            if (productId === '') {
                // Add new product
                products.push(productData);
            } else {
                // Update existing product
                products[parseInt(productId)] = productData;
            }

            // Save to localStorage
            localStorage.setItem('products', JSON.stringify(products));

            // Update products table
            displayProducts();

            // Hide form and show success message
            hideProductForm();
            showMessage('Product saved successfully!', 'success');

            // Update products page
            updateProductsPage();
        }

        // Edit product
        function editProduct(index) {
            const product = products[index];
            document.getElementById('form-title').textContent = 'Edit Product';
            document.getElementById('product-id').value = index;
            document.getElementById('product-name').value = product.name;
            document.getElementById('product-category').value = product.category;
            document.getElementById('product-price').value = product.price;
            document.getElementById('product-description').value = product.description;
            document.getElementById('product-ingredients').value = product.ingredients;
            document.getElementById('product-storage').value = product.storage;
            document.getElementById('product-weight').value = product.weight;
            document.getElementById('image-preview').src = product.image;
            document.getElementById('image-preview').style.display = 'block';
            document.getElementById('product-form').classList.add('active');
        }

        // Delete product
        function deleteProduct(index) {
            if (confirm('Are you sure you want to delete this product?')) {
                products.splice(index, 1);
                localStorage.setItem('products', JSON.stringify(products));
                displayProducts();
                showMessage('Product deleted successfully!', 'success');
                updateProductsPage();
            }
        }

        // Show message
        function showMessage(message, type) {
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');

            if (type === 'success') {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
            } else {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }

            setTimeout(() => {
                successMessage.style.display = 'none';
                errorMessage.style.display = 'none';
            }, 3000);
        }

        // Handle image preview
        document.getElementById('product-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('image-preview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Update products page
        function updateProductsPage() {
            // Dispatch a custom event to notify that products have been updated
            const event = new CustomEvent('productsUpdated', {
                detail: { products: products }
            });
            window.dispatchEvent(event);
            
            // Also update localStorage to ensure products page has latest data
            localStorage.setItem('products', JSON.stringify(products));
        }

        // Initial display of products
        displayProducts();
    </script>
</body>
</html>
