<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Pickles Paradise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #666;
            font-size: 1.1em;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }

        .auth-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: #666;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            color: #2ecc71;
            border-bottom: 2px solid #2ecc71;
            margin-bottom: -2px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #2ecc71;
            outline: none;
        }

        .form-group .error-message {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

        .form-group input.error {
            border-color: #e74c3c;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #27ae60;
        }

        .submit-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .auth-status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .auth-success {
            background: #d4edda;
            color: #155724;
        }

        .auth-error {
            background: #f8d7da;
            color: #721c24;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            user-select: none;
        }

        .toggle-password:hover {
            color: #2c3e50;
        }

        .social-auth {
            margin-top: 20px;
            text-align: center;
        }

        .social-auth p {
            color: #666;
            margin-bottom: 15px;
            position: relative;
        }

        .social-auth p:before,
        .social-auth p:after {
            content: "";
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #e9ecef;
        }

        .social-auth p:before {
            left: 0;
        }

        .social-auth p:after {
            right: 0;
        }

        .social-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .social-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            background: white;
            color: #2c3e50;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn:hover {
            border-color: #2ecc71;
            color: #2ecc71;
        }

        .social-btn img {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">Pickles Paradise</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <!-- Authentication Container -->
    <div class="auth-container">
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Please login or create an account to continue</p>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchTab('login')">Login</div>
            <div class="auth-tab" onclick="switchTab('register')">Register</div>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required>
                <div class="error-message"></div>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="password-toggle">
                    <input type="password" id="login-password" required>
                    <span class="toggle-password" onclick="togglePassword('login-password')">👁️</span>
                </div>
                <div class="error-message"></div>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="register-name">Full Name</label>
                <input type="text" id="register-name" required>
                <div class="error-message"></div>
            </div>
            <div class="form-group">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" required>
                <div class="error-message"></div>
            </div>
            <div class="form-group">
                <label for="register-password">Password</label>
                <div class="password-toggle">
                    <input type="password" id="register-password" required>
                    <span class="toggle-password" onclick="togglePassword('register-password')">👁️</span>
                </div>
                <div class="error-message"></div>
            </div>
            <div class="form-group">
                <label for="register-confirm-password">Confirm Password</label>
                <div class="password-toggle">
                    <input type="password" id="register-confirm-password" required>
                    <span class="toggle-password" onclick="togglePassword('register-confirm-password')">👁️</span>
                </div>
                <div class="error-message"></div>
            </div>
            <button type="submit" class="submit-btn">Register</button>
        </form>

        <!-- Social Authentication -->
        <div class="social-auth">
            <p>Or continue with</p>
            <div class="social-buttons">
                <button class="social-btn" onclick="socialLogin('google')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                    Google
                </button>
                <button class="social-btn" onclick="socialLogin('facebook')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook">
                    Facebook
                </button>
            </div>
        </div>

        <!-- Auth Status -->
        <div id="auth-status" class="auth-status"></div>
    </div>

    <script>
        // Form validation and submission
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const authStatus = document.getElementById('auth-status');

        // Real-time validation
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validatePassword(password) {
            return password.length >= 8;
        }

        function showError(input, message) {
            const formGroup = input.parentElement;
            const errorMessage = formGroup.querySelector('.error-message');
            input.classList.add('error');
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function clearError(input) {
            const formGroup = input.parentElement;
            const errorMessage = formGroup.querySelector('.error-message');
            input.classList.remove('error');
            errorMessage.style.display = 'none';
        }

        // Real-time validation for login form
        document.getElementById('login-email').addEventListener('input', function() {
            if (!validateEmail(this.value)) {
                showError(this, 'Please enter a valid email address');
            } else {
                clearError(this);
            }
        });

        document.getElementById('login-password').addEventListener('input', function() {
            if (!validatePassword(this.value)) {
                showError(this, 'Password must be at least 8 characters long');
            } else {
                clearError(this);
            }
        });

        // Real-time validation for register form
        document.getElementById('register-name').addEventListener('input', function() {
            if (this.value.length < 2) {
                showError(this, 'Name must be at least 2 characters long');
            } else {
                clearError(this);
            }
        });

        document.getElementById('register-email').addEventListener('input', function() {
            if (!validateEmail(this.value)) {
                showError(this, 'Please enter a valid email address');
            } else {
                clearError(this);
            }
        });

        document.getElementById('register-password').addEventListener('input', function() {
            if (!validatePassword(this.value)) {
                showError(this, 'Password must be at least 8 characters long');
            } else {
                clearError(this);
            }
        });

        document.getElementById('register-confirm-password').addEventListener('input', function() {
            const password = document.getElementById('register-password').value;
            if (this.value !== password) {
                showError(this, 'Passwords do not match');
            } else {
                clearError(this);
            }
        });

        // Form submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!validateEmail(email) || !validatePassword(password)) {
                return;
            }

            // Simulate login (replace with actual API call)
            simulateAuth('login', { email, password });
        });

        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;

            if (name.length < 2 || !validateEmail(email) || !validatePassword(password) || password !== confirmPassword) {
                return;
            }

            // Simulate registration (replace with actual API call)
            simulateAuth('register', { name, email, password });
        });

        // Simulate authentication (replace with actual API calls)
        function simulateAuth(type, data) {
            // Simulate API delay
            setTimeout(() => {
                if (type === 'login') {
                    // Simulate successful login
                    showStatus('Login successful! Redirecting...', 'success');
                    localStorage.setItem('user', JSON.stringify({ email: data.email }));
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    // Simulate successful registration
                    showStatus('Registration successful! Please login.', 'success');
                    setTimeout(() => {
                        switchTab('login');
                    }, 1500);
                }
            }, 1000);
        }

        // Show status message
        function showStatus(message, type) {
            authStatus.textContent = message;
            authStatus.className = `auth-status auth-${type}`;
            authStatus.style.display = 'block';
        }

        // Switch between login and register forms
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = document.querySelectorAll('.auth-form');

            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));

            if (tab === 'login') {
                tabs[0].classList.add('active');
                loginForm.classList.add('active');
            } else {
                tabs[1].classList.add('active');
                registerForm.classList.add('active');
            }

            // Clear status message when switching tabs
            authStatus.style.display = 'none';
        }

        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
        }

        // Social login simulation
        function socialLogin(provider) {
            showStatus(`Logging in with ${provider}...`, 'success');
            setTimeout(() => {
                localStorage.setItem('user', JSON.stringify({ email: `user@${provider}.com` }));
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>
</body>
</html>
